apiVersion: v1
kind: Namespace
metadata:
  name: stockroom-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: stockroom-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-image}
  template:
    metadata:
      labels: {app: broken-image}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:tag-does-not-exist
          ports: [{containerPort: 8080}]
