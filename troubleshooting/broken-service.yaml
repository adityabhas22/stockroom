apiVersion: v1
kind: Namespace
metadata:
  name: stockroom-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: stockroom-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-web}
  template:
    metadata:
      labels: {app: lab-web}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: stockroom-lab
spec:
  selector: {app: wrong-label}
  ports: [{port: 80, targetPort: 8080}]
