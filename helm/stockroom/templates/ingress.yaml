{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/session
            pathType: Exact
            backend:
              service: {name: {{ .Release.Name }}-frontend, port: {number: 8080}}
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-frontend, port: {number: 8080}}
{{- end }}
