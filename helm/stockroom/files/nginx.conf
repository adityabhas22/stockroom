map $request_method $login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_key zone=login:10m rate=5r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/session {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://stockroom-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://stockroom-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
